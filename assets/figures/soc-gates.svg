<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    .green { fill: #2f6b33; }
    .lbl { font-size: 12px; fill: #334155; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .soc { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .sec { fill: #f3e8ff; stroke: #9160b8; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .w { fill: #ffffff; stroke: #64748b; }
    .bus { fill: #dbe4ee; stroke: #64748b; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="468.5" rx="12"/>
  <text class="h" x="24" y="34">Where the gates sit inside the SoC</text>

  <!-- SoC outline -->
  <rect class="soc" x="18" y="48" width="704" height="350" rx="12"/>
  <text class="t" x="34" y="72" style="fill:#475569">SoC (one piece of silicon)</text>

  <!-- Masters -->
  <text class="s t" x="34" y="98">Who makes accesses</text>
  <rect class="os" x="34" y="108" width="214" height="64" rx="6"/>
  <text class="t" x="48" y="132">CPU core, normal world</text>
  <text class="s" x="48" y="152">Linux, or any OS · NS = 1</text>
  <rect class="sec" x="34" y="184" width="214" height="64" rx="6"/>
  <text class="t" x="48" y="208">CPU core, secure world</text>
  <text class="s" x="48" y="228">trusted program · NS = 0</text>
  <rect class="w" x="34" y="260" width="214" height="64" rx="6"/>
  <text class="t" x="48" y="284">GPU, DMA, PCIe, USB</text>
  <text class="s" x="48" y="304">direct memory access · NS = 1</text>

  <!-- Interconnect -->
  <rect class="bus" x="276" y="96" width="44" height="288" rx="6"/>
  <text class="t c" transform="translate(303,240) rotate(-90)" style="font-size:13px">on-chip interconnect</text>
  <path class="ar" d="M248,140 H274"/>
  <path class="ar" d="M248,216 H274"/>
  <path class="ar" d="M248,292 H274"/>

  <!-- Gates -->
  <text class="s t" x="350" y="98">Gates</text>
  <rect class="fw" x="350" y="108" width="170" height="104" rx="6"/>
  <text class="t" x="364" y="132">Memory gate</text>
  <text class="s" x="364" y="152">in the memory controller</text>
  <text class="s" x="364" y="170">region table:</text>
  <text class="s" x="364" y="186">which ranges are secure</text>
  <rect class="fw" x="350" y="252" width="170" height="104" rx="6"/>
  <text class="t" x="364" y="276">Device gate</text>
  <text class="s" x="364" y="296">in front of devices:</text>
  <text class="s" x="364" y="312">which devices are</text>
  <text class="s" x="364" y="328">secure-only</text>
  <path class="ar" d="M320,160 H348"/>
  <path class="ar" d="M320,304 H348"/>
  <text class="s" x="350" y="236">both read the NS bit</text>

  <!-- Devices inside SoC -->
  <text class="s t" x="552" y="98">Devices</text>
  <rect class="os" x="552" y="244" width="154" height="40" rx="6"/>
  <text x="564" y="269" style="font-size:13px">USB, Ethernet, …</text>
  <rect class="key" x="552" y="292" width="154" height="40" rx="6"/>
  <text x="564" y="317" style="font-size:13px">Key fuses</text>
  <rect class="key" x="552" y="340" width="154" height="40" rx="6"/>
  <text x="564" y="365" style="font-size:13px">Crypto key slots</text>
  <path class="ar" d="M520,280 L550,265"/>
  <path class="ar" d="M520,308 L550,311"/>
  <path class="ar" d="M520,336 L550,357"/>
  <text class="s" x="552" y="118">secure-only devices</text>
  <text class="s" x="552" y="134">answer only NS = 0</text>

  <!-- RAM outside SoC -->
  <rect class="hw" x="742" y="96" width="174" height="230" rx="10"/>
  <text class="t" x="756" y="120">RAM chips</text>
  <text class="s" x="756" y="138">next to the SoC</text>
  <rect class="os" x="756" y="150" width="146" height="74" rx="5"/>
  <text class="t" x="768" y="174" style="font-size:13px">normal region</text>
  <text class="s" x="768" y="194">Linux and its</text>
  <text class="s" x="768" y="210">programs</text>
  <rect class="sec" x="756" y="234" width="146" height="78" rx="5"/>
  <text class="t" x="768" y="258" style="font-size:13px">secure region</text>
  <text class="s" x="768" y="278">trusted program,</text>
  <text class="s" x="768" y="294">its keys and data</text>
  <path class="ar" d="M520,150 H754 V186"/>
  <path class="ar" d="M520,190 H740 V272 H754"/>

  <!-- Legend / rules -->
  <rect class="w" x="18" y="410" width="898" height="46" rx="8"/>
  <text x="34" y="430" style="font-size:13px"><tspan class="t">NS = 1</tspan> (normal world, GPU, DMA, PCIe, USB): normal region and normal devices only.</text>
  <text x="34" y="448" style="font-size:13px"><tspan class="t">NS = 0</tspan> (secure world): everything. The gates' own tables can be changed only with NS = 0.</text>
</svg>
