<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    .green { fill: #2f6b33; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .sec { fill: #f3e8ff; stroke: #9160b8; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .w { fill: #ffffff; stroke: #64748b; }
    .bad { fill: #fdecea; stroke: #c0392b; }
    .ok { fill: #e8f5e9; stroke: #548c58; }
    .new { stroke: #c98a1b; stroke-width: 3; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .lbl { font-size: 12px; fill: #334155; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="398.5" rx="12"/>
  <text class="h" x="24" y="34">With a TPM: the key is released only for the expected boot</text>
  <text class="s" x="802" y="34">signature checked</text>
  <circle cx="789" cy="30" r="8" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t" x="789" y="34" style="font-size:11px;fill:#548c58">✓</text>
  <rect class="hw" x="24.0" y="56" width="70.0" height="60" rx="6"/>
  <text class="c t" x="59.0" y="91" style="font-size:14px">Power on</text>
  <rect class="hw" x="134.0" y="56" width="124.4" height="60" rx="6"/>
  <text class="c t" x="196.2" y="82" style="font-size:14px">BootROM</text>
  <text class="c s" x="196.2" y="101">in the SoC</text>
  <rect class="fw" x="298.4" y="56" width="124.4" height="60" rx="6"/>
  <text class="c t" x="360.6" y="82" style="font-size:14px">Firmware</text>
  <text class="c s" x="360.6" y="101">signed</text>
  <rect class="os" x="462.8" y="56" width="124.4" height="60" rx="6"/>
  <text class="c t" x="525.0" y="82" style="font-size:14px">Boot loader</text>
  <text class="c s" x="525.0" y="101">signed</text>
  <rect class="os" x="627.2" y="56" width="124.4" height="60" rx="6"/>
  <text class="c t" x="689.4" y="82" style="font-size:13px">Kernel + initrd</text>
  <text class="c s" x="689.4" y="101">signed (UKI)</text>
  <rect class="os" x="791.6" y="56" width="124.4" height="60" rx="6"/>
  <text class="c t" x="853.8" y="82" style="font-size:13px">Root filesystem</text>
  <text class="c s" x="853.8" y="101">LUKS, encrypted</text>
  <path class="ar" d="M94.0,86.0 H132.0"/>
  <path class="ar" d="M258.4,86.0 H296.4"/>
  <circle cx="278.4" cy="71.0" r="9" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t" x="278.4" y="75.0" style="font-size:11px;fill:#548c58">✓</text>
  <path class="ar" d="M422.8,86.0 H460.8"/>
  <circle cx="442.8" cy="71.0" r="9" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t" x="442.8" y="75.0" style="font-size:11px;fill:#548c58">✓</text>
  <path class="ar" d="M587.2,86.0 H625.2"/>
  <circle cx="607.2" cy="71.0" r="9" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t" x="607.2" y="75.0" style="font-size:11px;fill:#548c58">✓</text>
  <path class="ar" d="M751.6,86.0 H789.6"/>
  <text class="c s" x="360.6" y="134" style="font-size:12px">records PCR 7</text>
  <rect class="key new" x="24" y="172" width="455.4" height="72" rx="6"/>
  <text class="t" x="38" y="196">TPM (fTPM on the Jetson)</text>
  <text class="s" x="38" y="216">unseals the key only if PCR 7 shows</text>
  <text class="s" x="38" y="232">secure boot on, with Hari's keys</text>
  <rect class="w" x="579.4" y="172" width="220" height="72" rx="6"/>
  <text class="c t" x="689.4" y="198">cryptsetup luksOpen</text>
  <text class="c s" x="689.4" y="218">run by the initrd</text>
  <text class="c s" x="689.4" y="234">passphrase → keyslot → volume key</text>
  <path class="ar" d="M479.4,208 H577.4"/>
  <text class="lbl c" x="529.4" y="200">passphrase</text>
  <path class="ar" d="M689.4,116 V170"/>
  <path class="ar" d="M799.4,208 H853.8 V118"/>
  <text class="lbl" x="861.8" y="162">opens</text>
  <text class="t" x="24" y="278">With this design:</text>
  <rect class="ok" x="24.0" y="290" width="214.0" height="64" rx="6"/>
  <text class="t green" x="36.0" y="318" style="font-size:18px">✓</text>
  <text class="t" x="58.0" y="315">Disk read on a laptop</text>
  <text class="s" x="58.0" y="335">stopped</text>
  <rect class="ok" x="250.0" y="290" width="214.0" height="64" rx="6"/>
  <text class="t green" x="262.0" y="318" style="font-size:18px">✓</text>
  <text class="t" x="284.0" y="315">Automatic boot</text>
  <text class="s" x="284.0" y="335">works</text>
  <rect class="ok" x="476.0" y="290" width="214.0" height="64" rx="6"/>
  <text class="t green" x="488.0" y="318" style="font-size:18px">✓</text>
  <text class="t" x="510.0" y="315">Edited /boot</text>
  <text class="s" x="510.0" y="335">stopped: bad signature</text>
  <rect class="ok" x="702.0" y="290" width="214.0" height="64" rx="6"/>
  <text class="t green" x="714.0" y="318" style="font-size:18px">✓</text>
  <text class="t" x="736.0" y="315">Replaced firmware</text>
  <text class="s" x="736.0" y="335">stopped: bad signature</text>
  <text x="24" y="384" style="font-size:13px">Secure boot switched off, or other keys installed: PCR 7 differs, and the TPM keeps the key.</text>
</svg>
