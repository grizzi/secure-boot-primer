<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .w { fill: #ffffff; stroke: #64748b; }
    .plainp { fill: #ffffff; stroke: #c0392b; stroke-dasharray: 5 3; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .link { stroke: #94a3b8; stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; }
    .nc { font-size: 11.5px; fill: #b42318; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="358.5" rx="12"/>
  <text class="h" x="24" y="34">Sam's first design: each program runs the next one, with no checks</text>

  <!-- Boot sequence -->
  <rect class="hw" x="24" y="56" width="100" height="48" rx="6"/>
  <text class="c" x="74" y="85">Power on</text>
  <path class="ar" d="M124,80 H172"/>
  <rect class="fw" x="174" y="56" width="150" height="48" rx="6"/>
  <text class="c t" x="249" y="85">Firmware</text>
  <path class="ar" d="M324,80 H372"/>
  <text class="nc" x="348" y="122">no check</text>
  <rect class="os" x="374" y="56" width="150" height="48" rx="6"/>
  <text class="c t" x="449" y="85">Boot loader</text>
  <path class="ar" d="M524,80 H572"/>
  <text class="nc" x="548" y="122">no check</text>
  <rect class="os" x="574" y="56" width="150" height="48" rx="6"/>
  <text class="c t" x="649" y="85">Kernel + initrd</text>
  <path class="ar" d="M724,80 H756"/>
  <text class="nc" x="740" y="122">no check</text>
  <rect class="os" x="758" y="56" width="158" height="48" rx="6"/>
  <text class="c t" x="837" y="85">Root filesystem</text>

  <!-- Storage -->
  <text class="s" x="24" y="186">where each one</text>
  <text class="s" x="24" y="202">is stored:</text>
  <rect class="hw" x="174" y="176" width="150" height="62" rx="6"/>
  <text class="c t" x="249" y="202">Flash chip</text>
  <text class="c s" x="249" y="222">on the board</text>
  <path class="link" d="M249,104 V174"/>

  <rect class="hw" x="374" y="150" width="542" height="160" rx="8"/>
  <text class="t" x="390" y="174">Disk</text>
  <rect class="plainp" x="386" y="186" width="346" height="110" rx="6"/>
  <text x="398" y="282"><tspan class="t">/boot</tspan> partition, plain</text>
  <rect class="w" x="394" y="200" width="110" height="36" rx="5"/>
  <text class="c" x="449" y="223" style="font-size:13px">boot loader</text>
  <rect class="w" x="584" y="200" width="130" height="36" rx="5"/>
  <text class="c" x="649" y="223" style="font-size:13px">kernel + initrd</text>
  <rect class="plainp" x="744" y="186" width="160" height="110" rx="6"/>
  <text x="756" y="208"><tspan class="t">/</tspan> root, plain</text>
  <text class="s" x="756" y="232">system programs</text>
  <text class="s" x="756" y="250">credentials</text>
  <text class="s" x="756" y="268">customer data</text>
  <path class="link" d="M449,104 V198"/>
  <path class="link" d="M649,104 V198"/>
  <path class="link" d="M837,104 V184"/>

  <text class="red" x="24" y="340">Nothing is checked and nothing is encrypted: anyone who has the disk can read and change every file.</text>
</svg>
