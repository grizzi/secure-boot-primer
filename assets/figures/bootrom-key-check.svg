<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .hw2 { fill: #ffffff; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .fw2 { fill: #ffffff; stroke: #4a73b8; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .ok { fill: #e8f5e9; stroke: #548c58; }
    .step { fill: #ffffff; stroke: #94a3b8; }
    .grp { fill: none; stroke: #64748b; stroke-dasharray: 6 4; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="328.5" rx="12"/>

  <!-- SoC -->
  <rect class="hw" x="24" y="48" width="240" height="262" rx="8"/>
  <text class="h" x="40" y="74">SoC</text>
  <rect class="hw2" x="40" y="88" width="208" height="60" rx="6"/>
  <text class="t" x="56" y="113">BootROM</text>
  <text class="s" x="56" y="134">fixed code, runs first</text>
  <rect class="hw2" x="40" y="164" width="208" height="130" rx="6"/>
  <text class="t" x="56" y="189">Fuses</text>
  <rect class="key" x="56" y="202" width="176" height="34" rx="5"/>
  <text x="66" y="224" style="font-size:13px">hash of Hari's firmware key</text>
  <text class="s" x="56" y="260">burned once by Hari,</text>
  <text class="s" x="56" y="278">never changed afterwards</text>

  <!-- Steps -->
  <rect class="grp" x="300" y="40" width="336" height="270" rx="8"/>
  <text class="h" x="316" y="64">At power-on, the BootROM:</text>
  <rect class="step" x="316" y="80" width="304" height="72" rx="6"/>
  <text x="330" y="102">1. Hashes the public key from the file</text>
  <text x="348" y="121">and compares it with the fuses.</text>
  <text class="red" x="348" y="141" style="font-size:13px">Different: stop.</text>
  <rect class="step" x="316" y="162" width="304" height="72" rx="6"/>
  <text x="330" y="184">2. Checks the signature of the code</text>
  <text x="348" y="203">with that public key.</text>
  <text class="red" x="348" y="223" style="font-size:13px">Invalid: stop.</text>
  <rect class="ok" x="316" y="244" width="304" height="50" rx="6"/>
  <text x="330" y="274">3. Runs the code.</text>

  <path class="ar" d="M248,118 H298"/>
  <path class="ar" d="M232,219 L314,132"/>

  <!-- Signed file -->
  <rect class="fw" x="676" y="48" width="240" height="262" rx="8"/>
  <text class="h" x="692" y="74">Signed firmware file</text>
  <text class="s" x="692" y="93">MB1, read from QSPI flash</text>
  <rect class="key" x="692" y="108" width="208" height="46" rx="6"/>
  <text class="c" x="796" y="136">Public key</text>
  <rect class="fw2" x="692" y="177" width="208" height="46" rx="6"/>
  <text class="c" x="796" y="205">Signature</text>
  <rect class="fw2" x="692" y="246" width="208" height="46" rx="6"/>
  <text class="c" x="796" y="274">Code</text>

  <path class="ar" d="M692,131 L622,116"/>
  <path class="ar" d="M692,200 L622,198"/>
  <path class="ar" d="M692,269 L622,269"/>
</svg>
