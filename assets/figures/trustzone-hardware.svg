<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    .green { fill: #2f6b33; }
    .lbl { font-size: 12px; fill: #334155; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .sec { fill: #f3e8ff; stroke: #9160b8; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arg { stroke: #548c58; stroke-width: 1.8; fill: none; marker-end: url(#g); }
    .arr { stroke: #c0392b; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .arp { stroke: #9160b8; stroke-width: 1.8; fill: none; marker-end: url(#p); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#548c58"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9160b8"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="398.5" rx="12"/>
  <text class="h" x="24" y="34">The hardware checks which world makes each access</text>

  <!-- Processor -->
  <rect class="hw" x="24" y="52" width="300" height="276" rx="10"/>
  <text class="t" x="40" y="76">Processor</text>
  <rect class="os" x="40" y="90" width="268" height="78" rx="6"/>
  <text class="t" x="54" y="114">Normal world</text>
  <text class="s" x="54" y="134">Linux, or any OS an attacker boots</text>
  <text class="s" x="54" y="152">accesses are flagged "normal"</text>
  <rect class="sec" x="40" y="234" width="268" height="78" rx="6"/>
  <text class="t" x="54" y="258">Secure world</text>
  <text class="s" x="54" y="278">small trusted program</text>
  <text class="s" x="54" y="296">accesses are flagged "secure"</text>
  <path class="arp" d="M120,168 V232"/>
  <text class="lbl" x="130" y="196">the only way in: one special</text>
  <text class="lbl" x="130" y="212">instruction, one fixed entry point</text>

  <!-- Access check -->
  <rect class="fw" x="384" y="52" width="170" height="276" rx="10"/>
  <text class="t c" x="469" y="76">Access check</text>
  <text class="s c" x="469" y="96">in the memory controller</text>
  <text class="s c" x="469" y="112">and in front of devices</text>
  <text class="s c" x="469" y="300">reads the flag of</text>
  <text class="s c" x="469" y="316">every single access</text>

  <!-- Targets -->
  <rect class="os" x="620" y="70" width="296" height="62" rx="6"/>
  <text class="t" x="636" y="96">Normal memory</text>
  <text class="s" x="636" y="116">Linux and its programs</text>
  <rect class="sec" x="620" y="160" width="296" height="62" rx="6"/>
  <text class="t" x="636" y="186">Secure memory</text>
  <text class="s" x="636" y="206">the trusted program and its data</text>
  <rect class="key" x="620" y="250" width="296" height="62" rx="6"/>
  <text class="t" x="636" y="276">Key fuses</text>
  <text class="s" x="636" y="296">wired to accept secure accesses only</text>

  <!-- Normal world accesses -->
  <path class="ar" d="M308,110 H382"/>
  <path class="arg" d="M554,101 H618"/>
  <circle cx="586" cy="88" r="9" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t green" x="586" y="92" style="font-size:11px">✓</text>
  <path class="ar" d="M308,150 H382"/>
  <path class="arr" d="M554,150 L596,180"/>
  <circle cx="600" cy="183" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text class="c t red" x="600" y="187" style="font-size:12px">✗</text>
  <text class="lbl red" x="560" y="140">refused</text>

  <!-- Secure world accesses -->
  <path class="ar" d="M308,272 H382"/>
  <path class="arg" d="M554,262 L618,196"/>
  <path class="arg" d="M554,276 H618"/>
  <circle cx="586" cy="276" r="9" fill="#e8f5e9" stroke="#548c58" stroke-width="1.5"/>
  <text class="c t green" x="586" y="280" style="font-size:11px">✓</text>

  <text x="24" y="358" style="font-size:13px">Because the check is in the hardware, replacing Linux with another operating system does not help: its accesses are still flagged</text>
  <text x="24" y="378" style="font-size:13px">"normal" and are still refused. Software only decides what runs inside the secure world.</text>
</svg>
