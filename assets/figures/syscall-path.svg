<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .m { font-size: 13px; }
    .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; font-size: 12px; }
    .green { fill: #2f6b33; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .w { fill: #ffffff; stroke: #64748b; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="384.5" rx="12"/>
  <text class="h" x="24" y="34">A program reads a file: every step goes through the kernel</text>

  <!-- Right: the same, seen with strace (static frame) -->
  <rect class="panel" x="528" y="52" width="388" height="318" rx="8"/>
  <text class="t" x="544" y="76">The same, seen with strace</text>
  <text class="s" x="544" y="94">one line per system call: its name, its</text>
  <text class="s" x="544" y="110">arguments, and after = the kernel's answer</text>

  <g data-step="1" data-caption="The program cat asks the kernel to open note.txt and read it. Each request is a system call.">
    <rect class="os" x="24" y="52" width="480" height="48" rx="6"/>
    <text class="t m" x="38" y="72">A program: cat note.txt</text>
    <text class="s" x="38" y="90">cannot touch the disk itself; asks the kernel for everything</text>
    <path class="ar" d="M160,100 V128"/>
    <text class="s" x="170" y="119">system calls: open, read</text>
    <text class="mono" x="544" y="146">openat(…, "note.txt") = 3</text>
    <text class="s" x="544" y="164">open the file; the kernel answers 3,</text>
    <text class="s" x="544" y="180">a number for the open file</text>
  </g>

  <rect class="fw" x="24" y="130" width="480" height="182" rx="8"/>
  <text class="t m" x="38" y="151">Linux kernel</text>

  <g data-step="2" data-caption="The kernel's filesystem code looks up which blocks of the disk hold the file.">
    <rect class="w" x="40" y="162" width="448" height="46" rx="5"/>
    <text class="t m" x="54" y="181">filesystem code (ext4)</text>
    <text class="s" x="54" y="198">finds which blocks of the disk hold note.txt</text>
    <path class="ar" d="M160,208 V230"/>
    <text class="s" x="170" y="224">block numbers</text>
  </g>

  <g data-step="3" data-caption="The driver for the NVMe disk asks the disk for those blocks.">
    <rect class="w" x="40" y="232" width="448" height="46" rx="5"/>
    <text class="t m" x="54" y="251">driver for the NVMe disk</text>
    <text class="s" x="54" y="268">the part of the kernel that talks to this kind of disk</text>
    <path class="ar" d="M160,312 V328"/>
    <rect class="hw" x="24" y="330" width="480" height="40" rx="6"/>
    <text class="t m" x="38" y="355">Disk</text>
    <text class="mono" x="80" y="355">/dev/nvme0n1p2</text>
  </g>

  <g data-step="4" data-caption="The bytes travel back up, and the kernel copies them into the program's memory: the answer to the read call.">
    <path class="ar" d="M380,328 V314"/>
    <path class="ar" d="M380,230 V210"/>
    <path class="ar" d="M380,128 V102"/>
    <text class="mono green" x="390" y="119">"hello from…"</text>
    <text class="mono" x="544" y="216">read(3, …) = "hello from the disk\n"</text>
    <text class="s" x="544" y="234">read from file 3; the answer is the</text>
    <text class="s" x="544" y="250">file's contents</text>
  </g>

  <g data-step="5" data-caption="To show the text, cat makes one more system call: it asks the kernel to write the bytes to its output.">
    <text class="mono" x="544" y="286">write(1, "hello from the disk\n")</text>
    <text class="s" x="544" y="304">write to file 1, the program's output</text>
    <text class="s" x="544" y="320">(the screen, or a file)</text>
  </g>
</svg>
