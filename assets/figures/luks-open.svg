<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .m { font-size: 13px; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; font-size: 12px; fill: #334155; }
    .green { fill: #2f6b33; }
    .orange { fill: #8a5a00; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .key { fill: #fff4e0; stroke: #c98a1b; stroke-width: 2; }
    .w { fill: #ffffff; stroke: #64748b; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="492.5" rx="12"/>
  <text class="h" x="24" y="34">An opened LUKS partition: decrypted on the way up, encrypted on the way down</text>

  <!--
    Layout: every box is centred on x = 469. The request travels down the left lane (x = 269),
    the data comes back up the right lane (x = 669). Labels sit on the inner side of each lane.
  -->

  <g data-step="1" data-caption="A program reads the file /etc/hostname, as on any computer.">
    <rect class="os" x="24" y="56" width="890" height="48" rx="6"/>
    <text class="t m c" x="469" y="76">A program reads /etc/hostname</text>
    <text class="s c" x="469" y="93">nothing changes for programs: they read and write files as usual</text>
  </g>

  <g data-step="2" data-caption="The filesystem code looks up the file's blocks on the mapped device, /dev/mapper/crypt_root.">
    <rect class="fw" x="24" y="134" width="890" height="262" rx="8"/>
    <text class="t m c" x="469" y="157">Linux kernel</text>
    <rect class="w" x="40" y="170" width="858" height="46" rx="5"/>
    <text class="t m c" x="469" y="189">filesystem code (ext4)</text>
    <text class="s c" x="469" y="206">mounted from <tspan class="mono">/dev/mapper/crypt_root</tspan></text>
    <path class="ar" d="M269,104 V168"/>
  </g>

  <g data-step="3" data-caption="dm-crypt passes the request on to the real partition.">
    <rect class="key" x="40" y="246" width="858" height="56" rx="5"/>
    <text class="t m c" x="469" y="269">dm-crypt</text>
    <text class="s c" x="469" y="288">holds the volume key in RAM</text>
    <text class="s c" x="269" y="279">writing: encrypts</text>
    <text class="s c" x="669" y="279">reading: decrypts</text>
    <path class="ar" d="M269,216 V244"/>
    <text class="s green" x="281" y="235">plain blocks</text>
  </g>

  <g data-step="4" data-caption="The NVMe driver reads the blocks from the LUKS partition: encrypted bytes only.">
    <rect class="w" x="40" y="332" width="858" height="48" rx="5"/>
    <text class="t m c" x="469" y="352">NVMe driver</text>
    <text class="s c" x="469" y="369">reads and writes <tspan class="mono">/dev/nvme0n1p2</tspan></text>
    <path class="ar" d="M269,302 V330"/>
    <text class="s orange" x="281" y="321">encrypted blocks</text>

    <rect class="hw" x="24" y="426" width="890" height="52" rx="6"/>
    <text class="t m c" x="469" y="447">LUKS partition on the disk</text>
    <text class="s c" x="469" y="465">header, then encrypted bytes only</text>
    <path class="ar" d="M269,380 V424"/>
  </g>

  <g data-step="5" data-caption="On the way back up, dm-crypt decrypts the blocks with the volume key, so the program receives the plain contents.">
    <path class="ar" d="M669,426 V382"/>
    <text class="mono orange e" x="657" y="416">4c e9 07 b1 …</text>
    <path class="ar" d="M669,332 V304"/>
    <text class="mono orange e" x="657" y="321">4c e9 07 b1 …</text>
    <path class="ar" d="M669,246 V218"/>
    <text class="mono green e" x="657" y="235">robot-01</text>
    <path class="ar" d="M669,170 V106"/>
    <text class="mono green e" x="657" y="124">robot-01</text>
  </g>
</svg>
