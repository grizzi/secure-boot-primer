<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .m { font-size: 13px; }
    .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; font-size: 12px; fill: #334155; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .w { fill: #ffffff; stroke: #64748b; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="438.5" rx="12"/>
  <text class="h" x="24" y="34">The kernel and the initrd</text>

  <!-- Left: the kernel -->
  <rect class="panel" x="24" y="52" width="428" height="372" rx="8"/>
  <text class="t" x="40" y="76">The kernel: the only way to the hardware</text>

  <rect class="os" x="44" y="90" width="388" height="44" rx="6"/>
  <text class="t m" x="58" y="109">A program</text>
  <text class="s" x="58" y="126">wants to show the file /etc/hostname</text>
  <path class="ar" d="M160,134 V170"/>
  <text class="s" x="170" y="157">system call: read the file</text>
  <path class="ar" d="M340,170 V136"/>
  <text class="mono" x="350" y="157">robot-01</text>

  <rect class="fw" x="44" y="172" width="388" height="176" rx="8"/>
  <text class="t m" x="58" y="193">Linux kernel</text>
  <rect class="w" x="60" y="204" width="356" height="48" rx="5"/>
  <text class="t m" x="74" y="224">filesystem code (ext4)</text>
  <text class="s" x="74" y="242">finds which blocks of the disk hold the file</text>
  <path class="ar" d="M160,252 V280"/>
  <path class="ar" d="M340,280 V254"/>
  <rect class="w" x="60" y="282" width="356" height="52" rx="5"/>
  <text class="t m" x="74" y="302">driver for the NVMe disk</text>
  <text class="s" x="74" y="321">asks the disk for those blocks</text>

  <path class="ar" d="M160,348 V374"/>
  <path class="ar" d="M340,374 V350"/>
  <rect class="hw" x="44" y="376" width="388" height="36" rx="6"/>
  <text class="t m" x="58" y="399">Disk</text>
  <text class="mono" x="100" y="399">/dev/nvme0n1p2</text>

  <!-- Right: the initrd -->
  <rect class="panel" x="468" y="52" width="448" height="372" rx="8"/>
  <text class="t" x="484" y="76">The initrd: a helper filesystem in RAM</text>

  <rect class="w" x="484" y="90" width="416" height="50" rx="6"/>
  <text class="t m" x="498" y="110">1. The boot loader loads both files into RAM</text>
  <text class="s" x="498" y="128">the kernel and the initrd, read from /boot</text>
  <path class="ar" d="M692,140 V156"/>
  <rect class="fw" x="484" y="158" width="416" height="50" rx="6"/>
  <text class="t m" x="498" y="178">2. The kernel starts and runs /init from the initrd</text>
  <text class="s" x="498" y="196">the initrd is unpacked into RAM as a temporary root filesystem</text>
  <path class="ar" d="M692,208 V224"/>
  <rect class="w" x="484" y="226" width="416" height="50" rx="6"/>
  <text class="t m" x="498" y="246">3. /init prepares the real root filesystem</text>
  <text class="s" x="498" y="264">loads the disk driver, mounts the root partition at /newroot</text>
  <path class="ar" d="M692,276 V292"/>
  <rect class="os" x="484" y="294" width="416" height="50" rx="6"/>
  <text class="t m" x="498" y="314">4. switch_root hands over</text>
  <text class="s" x="498" y="332">the root filesystem becomes /, and /sbin/init starts the system</text>

  <text class="s" x="484" y="376">Needed when preparing the root takes extra steps, such as</text>
  <text class="s" x="484" y="392">loading drivers or, in the next section, decrypting the disk.</text>
</svg>
