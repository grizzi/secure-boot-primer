<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .s { font-size: 12px; fill: #475569; }
    .c { text-anchor: middle; }
    .lbl { font-size: 12px; fill: #334155; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .hw { fill: #eef2f6; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .sec { fill: #f3e8ff; stroke: #9160b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arp { stroke: #9160b8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#p); }
    .brb { stroke: #4a73b8; stroke-width: 2; fill: none; }
    .brg { stroke: #548c58; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9160b8"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="788.5" rx="12"/>

  <!-- Power on -->
  <rect class="hw" x="270" y="20" width="140" height="36" rx="6"/>
  <text class="c" x="340" y="43">Power on</text>
  <path class="ar" d="M340,56 V94"/>

  <!-- BootROM -->
  <text class="t" x="24" y="122" style="fill:#64748b">root of trust</text>
  <rect class="hw" x="150" y="96" width="380" height="60" rx="6"/>
  <text class="t" x="166" y="120">BootROM</text>
  <text class="s" x="166" y="142">inside the SoC, cannot be changed; reads the fuses</text>
  <path class="ar" d="M340,156 V212"/>
  <text class="lbl" x="354" y="180">checks the BCT and MB1 against the PKC hash in the fuses</text>
  <text class="lbl" x="354" y="196">(only once the SoC is fused)</text>

  <!-- MB1/MB2 -->
  <rect class="fw" x="150" y="214" width="380" height="86" rx="6"/>
  <text class="t" x="166" y="238">MB1 / MB2</text>
  <text class="s" x="166" y="258">NVIDIA's first boot stages, in QSPI flash</text>
  <text class="s" x="166" y="274">set up clocks, memory, pinmux and GPIO</text>
  <text class="s" x="166" y="290">the BCT holds the board's pin settings</text>

  <!-- Secure world -->
  <path class="ar" d="M530,257 H618"/>
  <text class="lbl c" x="574" y="248">loads and</text>
  <text class="lbl c" x="574" y="274">checks</text>
  <rect class="sec" x="620" y="214" width="296" height="86" rx="6"/>
  <text class="t" x="636" y="238">ATF + OP-TEE</text>
  <text class="s" x="636" y="258">the secure world</text>
  <text class="s" x="636" y="274">OP-TEE decrypts the EKB</text>
  <text class="s" x="636" y="290">luks-srv, fTPM and other TAs</text>

  <path class="ar" d="M340,300 V352"/>
  <text class="lbl" x="354" y="331">loads and checks: PKC-signed, and SBK-encrypted, once fused</text>

  <!-- UEFI -->
  <rect class="fw" x="150" y="354" width="380" height="64" rx="6"/>
  <text class="t" x="166" y="378">UEFI firmware</text>
  <text class="s" x="166" y="400">NVIDIA's EDK2 build, in QSPI flash; boot menu with ESC</text>
  <path class="ar" d="M340,418 V472"/>
  <text class="lbl" x="354" y="442">UEFI secure boot: checks the signature against db</text>
  <text class="lbl" x="354" y="458">(PK → KEK → db)</text>

  <!-- Boot loader -->
  <rect class="os" x="150" y="474" width="380" height="72" rx="6"/>
  <text class="t" x="166" y="498">OS boot loader</text>
  <text class="s" x="166" y="518">today: L4TLauncher, reads /boot/extlinux/extlinux.conf</text>
  <text class="s" x="166" y="534">NixOS: systemd-boot or Lanzaboote, on the ESP</text>
  <path class="ar" d="M340,546 V600"/>
  <text class="lbl" x="354" y="570">checks the kernel and initrd: detached .sig files,</text>
  <text class="lbl" x="354" y="586">or one signed UKI</text>

  <!-- Kernel -->
  <rect class="os" x="150" y="602" width="380" height="64" rx="6"/>
  <text class="t" x="166" y="626">Linux kernel + initrd</text>
  <text class="s" x="166" y="648">the initrd asks luks-srv for the passphrase, opens LUKS</text>
  <path class="arp" d="M768,300 V634 H532"/>
  <text class="lbl" x="778" y="470" style="fill:#6b3d8f">disk passphrase</text>
  <text class="lbl" x="778" y="486" style="fill:#6b3d8f">(luks-srv)</text>
  <path class="ar" d="M340,666 V716"/>

  <!-- Root -->
  <rect class="os" x="230" y="718" width="220" height="40" rx="6"/>
  <text class="c t" x="340" y="743">Root filesystem</text>

  <!-- Layer brackets -->
  <path class="brb" d="M140,216 H130 V416 H140"/>
  <text class="t c" transform="translate(110,316) rotate(-90)" style="fill:#2f5597">Bootloader secure boot</text>
  <text class="s c" transform="translate(124,316) rotate(-90)">PKC key, hash in fuses</text>
  <path class="brg" d="M140,476 H130 V664 H140"/>
  <text class="t c" transform="translate(110,570) rotate(-90)" style="fill:#2f6b33">UEFI secure boot</text>
  <text class="s c" transform="translate(124,570) rotate(-90)">db keys, no fuses</text>
</svg>
