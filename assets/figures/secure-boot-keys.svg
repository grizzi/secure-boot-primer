<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 426" width="940" height="426">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .m { font-size: 13px; }
    .c { text-anchor: middle; }
    .tagt { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; font-size: 12px; font-weight: 600; fill: #2c4f8f; text-anchor: middle; }
    .red { fill: #b42318; }
    .green { fill: #2f6b33; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .w { fill: #ffffff; stroke: #64748b; }
    .ok { fill: #e8f5e9; stroke: #548c58; }
    .bad { fill: #fdecea; stroke: #c0392b; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .tag { fill: #e8f0fe; stroke: #4a73b8; stroke-width: 1; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="424.5" rx="12"/>
  <text class="h" x="24" y="34">Hari's key levels, with their UEFI names</text>

  <!-- Level 1 -->
  <rect class="key" x="32" y="56" width="560" height="56" rx="8"/>
  <text class="t" x="46" y="78">Owner key</text>
  <text class="s" x="46" y="98">private key: with Hari, offline, used rarely</text>
  <rect class="tag" x="480" y="66" width="98" height="22" rx="4"/>
  <text class="tagt" x="529" y="81">UEFI: PK</text>
  <path class="ar" d="M312,112 V142"/>
  <text class="s" x="322" y="131">signs every change to</text>

  <!-- Level 2 -->
  <rect class="key" x="32" y="144" width="560" height="56" rx="8"/>
  <text class="t" x="46" y="166">Update keys</text>
  <text class="s" x="46" y="186">one or more; private keys, for example on Hari's update server</text>
  <rect class="tag" x="480" y="154" width="98" height="22" rx="4"/>
  <text class="tagt" x="529" y="169">UEFI: KEK</text>
  <path class="ln" d="M312,200 V216 M168,216 H456"/>
  <path class="ar" d="M168,216 V232"/>
  <path class="ar" d="M456,216 V232"/>
  <text class="s" x="180" y="211">signs every change to</text>

  <!-- Level 3 -->
  <rect class="ok" x="32" y="234" width="272" height="84" rx="8"/>
  <text class="t" x="46" y="256">Allowed list</text>
  <text class="s" x="46" y="278">public keys, such as Hari's release</text>
  <text class="s" x="46" y="294">key, or hashes of single files,</text>
  <text class="s" x="46" y="310">whose programs may run</text>
  <rect class="tag" x="212" y="244" width="80" height="22" rx="4"/>
  <text class="tagt" x="252" y="259">UEFI: db</text>
  <rect class="bad" x="320" y="234" width="272" height="84" rx="8"/>
  <text class="t" x="334" y="256">Forbidden list</text>
  <text class="s" x="334" y="278">keys or hashes that must never run,</text>
  <text class="s" x="334" y="294">even if signed. It wins over</text>
  <text class="s" x="334" y="310">the allowed list.</text>
  <rect class="tag" x="500" y="244" width="80" height="22" rx="4"/>
  <text class="tagt" x="540" y="259">UEFI: dbx</text>
  <path class="ln" d="M168,318 V332 H456 V318"/>
  <path class="ar" d="M312,332 V350"/>
  <text class="s" x="322" y="346">checked at every boot</text>

  <!-- Level 4 -->
  <rect class="os" x="32" y="352" width="560" height="56" rx="8"/>
  <text class="t" x="46" y="374">Boot programs</text>
  <text class="s" x="46" y="394">boot loader, kernel and initrd: run only if allowed and not forbidden</text>

  <!-- Modes -->
  <rect class="panel" x="616" y="56" width="300" height="352" rx="8"/>
  <text class="t" x="632" y="80">When the firmware checks</text>
  <rect class="bad" x="632" y="94" width="268" height="96" rx="6"/>
  <text class="t m" x="646" y="116">No owner key yet</text>
  <text class="s" x="646" y="136">checks nothing, so that the</text>
  <text class="s" x="646" y="152">owner can install the keys</text>
  <rect class="tag" x="646" y="160" width="160" height="22" rx="4"/>
  <text class="tagt" x="726" y="175">UEFI: Setup Mode</text>
  <path class="ar" d="M766,190 V222"/>
  <text class="s" x="776" y="203">Hari installs</text>
  <text class="s" x="776" y="217">his public owner key</text>
  <rect class="ok" x="632" y="224" width="268" height="96" rx="6"/>
  <text class="t m" x="646" y="246">Owner key installed</text>
  <text class="s" x="646" y="266">checks every boot program;</text>
  <text class="s" x="646" y="282">key changes need signatures</text>
  <rect class="tag" x="646" y="290" width="160" height="22" rx="4"/>
  <text class="tagt" x="726" y="305">UEFI: User Mode</text>
  <text class="s" x="632" y="350">The firmware stores only public</text>
  <text class="s" x="632" y="366">keys. UEFI keeps them, and the</text>
  <text class="s" x="632" y="382">lists, in variables in the flash chip.</text>
</svg>
