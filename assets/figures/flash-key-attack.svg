<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 384" width="940" height="384">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; }
    .t { font-weight: 600; }
    .h { font-weight: 600; font-size: 15px; }
    .s { font-size: 12px; fill: #475569; }
    .m { font-size: 13px; }
    .c { text-anchor: middle; }
    .red { fill: #b42318; }
    .or { font-size: 12px; font-weight: 600; fill: #64748b; }
    .scr { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; font-size: 10.5px; fill: #cbd5e1; }
    .scrk { fill: #1e293b; font-weight: 700; }
    rect { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: #cbd5e1; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .pcb { fill: #e2e8f0; stroke: #64748b; }
    .chip { fill: #cbd5e1; stroke: #64748b; }
    .fw { fill: #e8f0fe; stroke: #4a73b8; }
    .os { fill: #e8f5e9; stroke: #548c58; }
    .key { fill: #fff4e0; stroke: #c98a1b; }
    .w { fill: #ffffff; stroke: #64748b; }
    .metal { fill: #cbd5e1; stroke: #64748b; }
    .leg { fill: #94a3b8; stroke: none; }
    .clip { fill: #334155; stroke: none; }
    .trace { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .wire { stroke-width: 2; fill: none; stroke-linecap: round; }
    .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .ark { stroke: #c98a1b; stroke-width: 1.8; fill: none; marker-end: url(#k); }
    .keyl { stroke: #c98a1b; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a1b"/>
    </marker>
  </defs>
  <rect class="bg" x="0.75" y="0.75" width="938.5" height="382.5" rx="12"/>
  <text class="h" x="24" y="34">A key in the flash chip: two ways to read it</text>

  <!-- 1. The thief takes the whole robot -->
  <g data-step="1" data-caption="The thief takes the whole robot: the disk, and the board with the flash chip that holds the key.">
    <rect class="panel" x="24" y="52" width="160" height="314" rx="8"/>
    <text class="t m c" x="104" y="76">Takes the robot</text>

    <!-- a small two-wheeled robot -->
    <path class="trace" style="stroke-width:6; stroke-linecap:round" d="M84,196 L72,232 M124,196 L136,232"/>
    <circle cx="72" cy="232" r="22" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="72" cy="232" r="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="136" cy="232" r="22" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="136" cy="232" r="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <path class="trace" d="M104,124 V132 M118,104 L124,92"/>
    <circle cx="124.500" cy="90" r="2.500" fill="#64748b"/>
    <rect class="w" x="84" y="100" width="40" height="24" rx="6"/>
    <circle cx="104" cy="112" r="6.500" fill="#1e293b"/>
    <circle cx="106" cy="110" r="1.800" fill="#ffffff"/>
    <rect class="w" x="62" y="132" width="84" height="68" rx="10"/>
    <!-- the board inside it -->
    <rect class="pcb" x="72" y="142" width="64" height="48" rx="3" style="stroke-width:1.2"/>
    <rect class="chip" x="79" y="149" width="18" height="18" rx="1.500" style="stroke-width:1"/>
    <rect class="fw" x="106" y="152" width="22" height="12" rx="1.500" style="stroke-width:1.2"/>
    <rect class="os" x="79" y="174" width="49" height="9" rx="1.500" style="stroke-width:1.2"/>

    <text class="s c" x="104" y="290">The disk, and the board</text>
    <text class="s c" x="104" y="307">with the flash chip that</text>
    <text class="s c" x="104" y="324">holds the key.</text>
  </g>

  <!-- 2a. A flash programmer -->
  <g data-step="2" data-caption="Way 1: a flash programmer clips onto the pins of the flash chip and copies its contents. The robot stays switched off.">
    <path class="ar" d="M184,170 C198,170 196,126 208,126"/>
    <rect class="panel" x="210" y="52" width="312" height="147" rx="8"/>
    <text class="t m" x="224" y="76">Way 1: a flash programmer</text>

    <rect class="pcb" x="224" y="88" width="112" height="70" rx="6"/>
    <circle cx="233" cy="97" r="2.500" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <circle cx="233" cy="149" r="2.500" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <!-- flash chip: body, eight legs, the key inside -->
    <rect class="leg" x="261" y="103" width="5" height="8"/><rect class="leg" x="271" y="103" width="5" height="8"/><rect class="leg" x="281" y="103" width="5" height="8"/><rect class="leg" x="291" y="103" width="5" height="8"/>
    <rect class="leg" x="261" y="135" width="5" height="8"/><rect class="leg" x="271" y="135" width="5" height="8"/><rect class="leg" x="281" y="135" width="5" height="8"/><rect class="leg" x="291" y="135" width="5" height="8"/>
    <rect class="fw" x="256" y="109" width="46" height="28" rx="2"/>
    <circle class="keyl" cx="268" cy="123" r="4"/>
    <path class="keyl" d="M272,123 H292 M286,123 V128 M291,123 V128"/>
    <!-- the clip gripping the legs -->
    <rect class="clip" x="254" y="96" width="50" height="9" rx="2"/>
    <rect class="clip" x="254" y="141" width="50" height="9" rx="2"/>
    <rect class="clip" x="304" y="96" width="11" height="54" rx="3"/>
    <!-- wires to the programmer -->
    <path class="wire" stroke="#c0392b" d="M315,110 C350,98 366,100 396,114"/>
    <path class="wire" stroke="#c98a1b" d="M315,119 C350,110 366,112 396,120"/>
    <path class="wire" stroke="#548c58" d="M315,128 C350,122 366,124 396,126"/>
    <path class="wire" stroke="#4a73b8" d="M315,137 C350,134 366,136 396,132"/>
    <rect class="w" x="396" y="104" width="78" height="40" rx="5"/>
    <circle cx="407" cy="114" r="3" fill="#c0392b"/>
    <text class="s c" x="437" y="132">programmer</text>
    <rect class="metal" x="474" y="115" width="14" height="18" rx="1.500"/>
    <path class="trace" d="M488,124 H510"/>
    <text class="s c" x="280" y="172" style="font-size:11px">flash chip</text>

    <text class="s" x="350" y="168">Clips onto the chip's pins and</text>
    <text class="s" x="350" y="185">copies it. The robot stays off.</text>
  </g>

  <!-- 2b. Another operating system -->
  <g data-step="3" data-caption="Way 2: the thief starts the robot from a USB stick. That operating system reads the flash chip, just as Hari's Linux does.">
    <path class="ar" d="M184,250 C198,250 196,292 208,292"/>
    <text class="or c" x="366" y="213">or</text>
    <rect class="panel" x="210" y="219" width="312" height="147" rx="8"/>
    <text class="t m" x="224" y="243">Way 2: another operating system</text>

    <!-- USB stick, plugged into the board -->
    <rect class="w" x="224" y="278" width="40" height="26" rx="4"/>
    <text class="s c" x="244" y="295" style="font-size:10px">OS</text>
    <rect class="metal" x="264" y="283" width="14" height="16" rx="1"/>
    <rect class="pcb" x="278" y="255" width="150" height="72" rx="6"/>
    <rect class="leg" x="278" y="281" width="10" height="20"/>
    <circle cx="420" cy="263" r="2.500" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <circle cx="420" cy="319" r="2.500" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <path class="trace" d="M288,291 H298"/>
    <rect class="chip" x="298" y="269" width="44" height="44" rx="3"/>
    <text class="s c" x="320" y="295" style="font-size:11px">CPU</text>
    <!-- flash chip with the key; the CPU reads it -->
    <rect class="leg" x="375" y="271" width="5" height="8"/><rect class="leg" x="385" y="271" width="5" height="8"/><rect class="leg" x="395" y="271" width="5" height="8"/><rect class="leg" x="405" y="271" width="5" height="8"/>
    <rect class="leg" x="375" y="303" width="5" height="8"/><rect class="leg" x="385" y="303" width="5" height="8"/><rect class="leg" x="395" y="303" width="5" height="8"/><rect class="leg" x="405" y="303" width="5" height="8"/>
    <rect class="fw" x="370" y="277" width="46" height="28" rx="2"/>
    <circle class="keyl" cx="382" cy="291" r="4"/>
    <path class="keyl" d="M386,291 H406 M400,291 V296 M405,291 V296"/>
    <path class="ark" d="M368,291 H346"/>

    <text class="s" x="440" y="281">the thief's</text>
    <text class="s" x="440" y="297">system reads</text>
    <text class="s" x="440" y="313">the chip</text>

    <text class="s c" x="244" y="321" style="font-size:11px">USB stick</text>

    <text class="s" x="224" y="349">The robot is started from the thief's USB stick.</text>
  </g>

  <!-- 3. The key is in the copy -->
  <g data-step="4" data-caption="Either way, the thief's laptop now holds a copy of the flash chip, and the key is among its bytes.">
    <path class="ar" d="M522,126 C536,126 534,170 546,170"/>
    <path class="ar" d="M522,292 C536,292 534,250 546,250"/>
    <rect class="panel" x="548" y="52" width="174" height="314" rx="8"/>
    <text class="t m c" x="635" y="76">The key is in the copy</text>

    <!-- laptop -->
    <rect x="570" y="104" width="130" height="92" rx="6" fill="#1e293b" stroke="#0f172a"/>
    <text class="scr" x="582" y="126">00a0  4c e9 07 b1</text>
    <rect x="578" y="134" width="114" height="17" rx="2" fill="#f6c768" stroke="none"/>
    <text class="scr scrk" x="582" y="146">00b0  7f 3a 91 c2</text>
    <text class="scr" x="582" y="166">00c0  a2 19 fe 63</text>
    <text class="scr" x="582" y="186">00d0  0c 71 5a 3f</text>
    <path d="M566,196 H704 L716,212 H554 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
    <path class="trace" d="M618,204 H652"/>
    <circle class="keyl" cx="603" cy="237" r="4.500"/>
    <path class="keyl" d="M607.500,237 H626 M620,237 V242 M625,237 V242"/>
    <text class="s t" x="636" y="241" style="fill:#8a5a00">the key</text>

    <text class="s c" x="635" y="273">Either way, the thief's</text>
    <text class="s c" x="635" y="290">laptop holds a copy of the</text>
    <text class="s c" x="635" y="307">flash chip. The key is</text>
    <text class="s c" x="635" y="324">among its bytes.</text>
  </g>

  <!-- 4. The disk opens -->
  <g data-step="5" data-caption="With the key, the disk opens on the thief's laptop, and every file is readable.">
    <path class="ar" d="M722,209 H746"/>
    <rect class="panel" x="748" y="52" width="168" height="314" rx="8"/>
    <text class="t m c" x="832" y="76">The disk opens</text>

    <!-- the disk -->
    <rect class="os" x="774" y="104" width="122" height="34" rx="3"/>
    <rect x="766" y="110" width="9" height="22" fill="#e3b341" stroke="#c98a1b" stroke-width="1"/>
    <rect class="chip" x="788" y="112" width="30" height="18" rx="1.500" style="stroke-width:1"/>
    <rect class="chip" x="826" y="112" width="46" height="18" rx="1.500" style="stroke-width:1"/>
    <circle cx="885" cy="121" r="3" fill="#f8fafc" stroke="#548c58" stroke-width="1"/>
    <!-- key, then an open padlock -->
    <circle class="keyl" cx="786" cy="180" r="7" style="stroke-width:2.6"/>
    <path class="keyl" style="stroke-width:2.6" d="M793,180 H820 M811,180 V187 M818,180 V187"/>
    <path class="ar" d="M828,180 H848"/>
    <path class="keyl" style="stroke-width:2.6" d="M858,174 V163 a8,8 0 0 1 16,0 V166"/>
    <rect class="key" x="852" y="174" width="28" height="22" rx="3"/>
    <circle cx="866" cy="185" r="2.500" fill="#c98a1b"/>
    <!-- files -->
    <g fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round">
      <path d="M786,216 h15 l7,7 v23 h-22 z"/><path d="M821,216 h15 l7,7 v23 h-22 z"/><path d="M856,216 h15 l7,7 v23 h-22 z"/>
    </g>
    <path class="trace" style="stroke-width:1.3" d="M790,230 h14 M790,236 h14 M790,241 h9 M825,230 h14 M825,236 h14 M825,241 h9 M860,230 h14 M860,236 h14 M860,241 h9"/>

    <text class="s c" x="832" y="290">With the key, the disk opens</text>
    <text class="s c" x="832" y="307">on the thief's laptop:</text>
    <text class="m c red" x="832" y="325">every file is readable.</text>
  </g>
</svg>
