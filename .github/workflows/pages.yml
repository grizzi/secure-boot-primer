# Builds the site with Hugo and publishes it on GitHub Pages at every push to main.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -sSfLO "${base}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check links
        run: python3 tools/check_links.py public "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
